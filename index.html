<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" href="./img/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="./img/favicon.png">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html"><img src="./img/Fotogram_Logo.svg" alt="Fotogram Logo" class="logo-image"></a>

            <button id="menu-toggle" class="menu-toggle" aria-label="Menü öffnen">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </button>
        </div>

        <div id="side-menu" class="side-menu">
            <nav>
                <ul>
                    <li><a href="#photo-section">Alle Fotos</a></li>
                    <li><a href="#photo-albums-section">Alben</a></li>
                    <li><a href="datenschutz.html">Datenschutz</a></li>
                    <li><a href="impressum.html">Impressum</a></li>
                    <li><a href="kontakt.html">Kontakt</a></li> 
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="main-header">
        <h1>Dein persönliches Fotoalbum</h1>
        </section>

        <section class="photo-section">
            <div class="photo-container">
                <img src="./img/pictures/ai-9840311_1280.png" alt="Bild1" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/ai-generated-8113881_1280.jpg" alt="Bild2" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/caffeine-1866758_1280.jpg" alt="Bild3" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/coffee-4289545_1280.jpg" alt="Bild4" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/forest-3394066_1280.jpg" alt="Bild5" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/fruit-6633086_1280.jpg" alt="Bild6" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/jellyfish-2566795_1280.jpg" alt="Bild7" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/mood-4639945_1280.jpg" alt="Bild8" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/moon-4606246_1280.jpg" alt="Bild9" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/new-year-background-3625405_1280.jpg" alt="Bild10" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/octopus-8562474_1920.jpg" alt="Bild11" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/planet-1702788_1280.jpg" alt="Bild12" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/siamese-cat-5320568_1280.jpg" alt="Bild13" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/star-4167939_1920.jpg" alt="Bild14" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/starry-sky-2051448_1280.jpg" alt="Bild15" class="photo-image">
            </div>
            <div class="photo-container">
                <img src="./img/pictures/summer-thunder-storm-3465247_1280.jpg" alt="Bild16" class="photo-image">
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
                <a href="index.html">
                    <img class="footer-logo" src="./img/favicon.png" alt="Footer-Logo">
                </a>
                <div class="data-protection-imprint">
                    <a class="data-protection-imprint" href="datenschutz.html">Datenschutz</a>
                    <a class="data-protection-imprint" href="impressum.html">Impressum</a>
                </div>
                <div class="footer-socials">
                    <a href="https://de-de.facebook.com/" target="_blank">
                        <img class="social-img" src="./img/facebook_logo.svg" alt="facebook-logo">
                    </a>
                    <a href="https://www.instagram.com/" target="_blank">
                        <img class="social-img" src="./img/instagram_logo.svg" alt="instagram-logo">
                    </a>
                </div>
            </div>
    </footer>

    <div id="image-dialog" class="image-dialog">
        <div class="dialog-content">
            <div class="dialog-header">
                <span id="image-title" class="image-title"></span>
                <a id="original-size-link" href="#" target="_blank" class="original-size-link" title="Bild in Originalgröße öffnen">
                    <img src="./img/plus.svg" alt="Originalgröße" class="plus-icon">
                </a>
                <span class="close-button">&times;</span>
            </div>
            <div class="dialog-image-container">
                <img id="dialog-image" src="" alt="Großansicht" class="dialog-image">
            </div>
            <div class="dialog-footer">
                <button id="prev-button" class="nav-button left-arrow">
                    <img src="./img/left-arrow.png" alt="Vorheriges Bild" class="arrow-icon">
                </button>
                <span id="image-counter"></span>
                <button id="next-button" class="nav-button right-arrow">
                    <img src="./img/right-arrow.png" alt="Nächstes Bild" class="arrow-icon">
                </button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
